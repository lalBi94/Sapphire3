name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Discord sidecar
        run: pnpm presence:build

      - name: Test Discord sidecar
        run: pnpm presence:test

      - name: Test Discord IPC
        run: pnpm presence:ipc-test

      - name: Test Discord without Discord
        run: pnpm presence:nodiscord-test

      - name: Check whitespace, conflict markers and focused tests
        run: |
          git diff --check "origin/${{ github.base_ref }}...HEAD"
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- . ':!pnpm-lock.yaml'; then
            echo "::error::Conflict markers found."
            exit 1
          fi
          if git grep -nE '\.only\(' -- tests; then
            echo "::error::Focused tests are not allowed."
            exit 1
          fi

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build
