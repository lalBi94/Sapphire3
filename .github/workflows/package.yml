name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build portable archives
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows, Linux and macOS archives
        run: pnpm dist:all

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: sapphire3-portable-${{ github.sha }}
          path: |
            build/release/Sapphire3-*-windows.zip
            build/release/Sapphire3-*-linux-*.tar.gz
            build/release/Sapphire3-*-macos-*.zip
          if-no-files-found: error
